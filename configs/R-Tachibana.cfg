enable
configure terminal
hostname Tachibana
no ip domain-lookup

interface FastEthernet0/0
 description Link P2P to Wired
 ip address 10.82.16.62 255.255.255.252
 no shutdown
exit

interface FastEthernet0/1
 description LAN Switch9 (Collective & Ghost)
 ip address 10.82.10.1 255.255.254.0
 no shutdown
exit

interface Ethernet0/0/0
 description Link P2P to Deus
 ip address 10.82.16.73 255.255.255.252
 no shutdown
exit

ip dhcp pool POOL_SWITCH9
 network 10.82.10.0 255.255.254.0
 default-router 10.82.10.1
 dns-server 8.8.8.8
exit

ip route 0.0.0.0 0.0.0.0 10.82.16.61

ip route 10.82.14.0 255.255.255.128 10.82.16.74
ip route 10.82.15.0 255.255.255.192 10.82.16.74
ip route 10.82.15.128 255.255.255.192 10.82.16.74
ip route 10.82.16.0 255.255.255.224 10.82.16.74
ip route 10.82.16.48 255.255.255.248 10.82.16.74
ip route 10.82.16.76 255.255.255.252 10.82.16.74
ip route 10.82.16.80 255.255.255.240 10.82.16.74

end
write memory
