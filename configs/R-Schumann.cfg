enable
configure terminal
hostname Schumann
no ip domain-lookup

interface FastEthernet0/0
 description Link Multi-Access Switch2
 ip address 10.82.16.36 255.255.255.248
 no shutdown
exit

interface FastEthernet0/1
 description Direct Link to Akashic
 ip address 10.82.16.41 255.255.255.248
 no shutdown
exit

interface FastEthernet1/0
 description Link P2P to Accela
 ip address 10.82.16.69 255.255.255.252
 no shutdown
exit

ip dhcp pool POOL_AKASHIC
 network 10.82.16.40 255.255.255.248
 default-router 10.82.16.41
 dns-server 8.8.8.8
exit

ip route 0.0.0.0 0.0.0.0 10.82.16.33
ip route 10.82.4.0 255.255.252.0 10.82.16.70

end
write memory
