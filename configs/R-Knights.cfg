enable
configure terminal
hostname Knights
no ip domain-lookup

interface FastEthernet0/0
 description Link P2P to Protocol7
 ip address 10.82.16.82 255.255.255.252
 no shutdown
exit

interface FastEthernet0/1
 description Direct Link to Eiri
 ip address 10.82.16.49 255.255.255.248
 no shutdown
exit

interface FastEthernet1/0
 description Link P2P to Phantoma
 ip address 10.82.16.85 255.255.255.252
 no shutdown
exit

ip dhcp pool POOL_EIRI
 network 10.82.16.48 255.255.255.248
 default-router 10.82.16.49
 dns-server 8.8.8.8
exit

ip route 0.0.0.0 0.0.0.0 10.82.16.81

ip route 10.82.15.0 255.255.255.192 10.82.16.86
ip route 10.82.16.0 255.255.255.224 10.82.16.86
ip route 10.82.16.88 255.255.255.252 10.82.16.86

end
write memory
