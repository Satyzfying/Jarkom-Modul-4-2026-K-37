enable
configure terminal
hostname Navi
no ip domain-lookup

interface Ethernet0/0/0
 description Link P2P to Wired
 ip address 10.82.16.66 255.255.255.252
 no shutdown
exit

interface FastEthernet0/0
 description LAN Switch6 (Alice & Reika)
 ip address 10.82.12.1 255.255.255.0
 no shutdown
exit

interface FastEthernet0/1
 description LAN Switch8 (Yasuo, Miho, Kuma)
 ip address 10.82.13.1 255.255.255.0
 no shutdown
exit

interface FastEthernet1/0
 description LAN Switch7 (Taro)
 ip address 10.82.15.65 255.255.255.192
 no shutdown
exit

ip dhcp pool POOL_SWITCH6
 network 10.82.12.0 255.255.255.0
 default-router 10.82.12.1
 dns-server 8.8.8.8
exit

ip dhcp pool POOL_SWITCH8
 network 10.82.13.0 255.255.255.0
 default-router 10.82.13.1
 dns-server 8.8.8.8
exit

ip dhcp pool POOL_SWITCH7
 network 10.82.15.64 255.255.255.192
 default-router 10.82.15.65
 dns-server 8.8.8.8
exit

ip route 0.0.0.0 0.0.0.0 10.82.16.65

end
write memory
