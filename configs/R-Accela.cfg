enable
configure terminal
hostname Accela
no ip domain-lookup

interface FastEthernet0/0
 description Link P2P to Schumann
 ip address 10.82.16.70 255.255.255.252
 no shutdown
exit

interface FastEthernet0/1
 description LAN Switch5 (Omnipresence & Denpa)
 ip address 10.82.4.1 255.255.252.0
 no shutdown
exit

ip dhcp pool POOL_SWITCH5
 network 10.82.4.0 255.255.252.0
 default-router 10.82.4.1
 dns-server 8.8.8.8
exit

ip route 0.0.0.0 0.0.0.0 10.82.16.69

end
write memory
