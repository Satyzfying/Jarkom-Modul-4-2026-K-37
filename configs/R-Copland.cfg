enable
configure terminal
hostname Copland
no ip domain-lookup

interface FastEthernet0/0
 description Link Multi-Access Switch2
 ip address 10.82.16.35 255.255.255.248
 no shutdown
exit

interface FastEthernet0/1
 description LAN Switch4 (Masayuki)
 ip address 10.82.8.1 255.255.254.0
 no shutdown
exit

interface Ethernet0/0/0
 description Direct Link to Juri
 ip address 10.82.15.193 255.255.255.192
 no shutdown
exit

ip dhcp pool POOL_SWITCH4
 network 10.82.8.0 255.255.254.0
 default-router 10.82.8.1
 dns-server 8.8.8.8
exit

ip dhcp pool POOL_JURI
 network 10.82.15.192 255.255.255.192
 default-router 10.82.15.193
 dns-server 8.8.8.8
exit

ip route 0.0.0.0 0.0.0.0 10.82.16.33

end
write memory
