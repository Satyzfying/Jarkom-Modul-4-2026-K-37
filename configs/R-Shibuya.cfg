enable
configure terminal
hostname Shibuya
no ip domain-lookup

interface FastEthernet0/0
 description Link P2P to Phantoma
 ip address 10.82.16.90 255.255.255.252
 no shutdown
exit

interface FastEthernet0/1
 description LAN Switch13 (Lain & Mika)
 ip address 10.82.15.1 255.255.255.192
 no shutdown
exit

ip dhcp pool POOL_SWITCH13
 network 10.82.15.0 255.255.255.192
 default-router 10.82.15.1
 dns-server 8.8.8.8
exit

ip route 0.0.0.0 0.0.0.0 10.82.16.89

end
write memory
