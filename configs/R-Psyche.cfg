enable
configure terminal
hostname Psyche
no ip domain-lookup

interface FastEthernet0/0
 description Link Multi-Access Switch2
 ip address 10.82.16.34 255.255.255.248
 no shutdown
exit

interface FastEthernet0/1
 description LAN Switch3 (Karl & Lin)
 ip address 10.82.0.1 255.255.252.0
 no shutdown
exit

ip dhcp pool POOL_SWITCH3
 network 10.82.0.0 255.255.252.0
 default-router 10.82.0.1
 dns-server 8.8.8.8
exit

ip route 0.0.0.0 0.0.0.0 10.82.16.33

end
write memory
