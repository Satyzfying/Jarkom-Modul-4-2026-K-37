enable
configure terminal
hostname Protocol7
no ip domain-lookup

interface FastEthernet0/0
 description Link P2P to Deus
 ip address 10.82.16.78 255.255.255.252
 no shutdown
exit

interface FastEthernet0/1
 description LAN Switch11 (Chisa & Hodgeson)
 ip address 10.82.15.129 255.255.255.192
 no shutdown
exit

interface Ethernet0/0/0
 description Link P2P to Knights
 ip address 10.82.16.81 255.255.255.252
 no shutdown
exit

ip dhcp pool POOL_SWITCH11
 network 10.82.15.128 255.255.255.192
 default-router 10.82.15.129
 dns-server 8.8.8.8
exit

ip route 0.0.0.0 0.0.0.0 10.82.16.77

ip route 10.82.15.0 255.255.255.192 10.82.16.82
ip route 10.82.16.0 255.255.255.224 10.82.16.82
ip route 10.82.16.48 255.255.255.248 10.82.16.82
ip route 10.82.16.84 255.255.255.252 10.82.16.82
ip route 10.82.16.88 255.255.255.252 10.82.16.82

end
write memory
