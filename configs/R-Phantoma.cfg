enable
configure terminal
hostname Phantoma
no ip domain-lookup

interface FastEthernet0/0
 description Link P2P to Knights
 ip address 10.82.16.86 255.255.255.252
 no shutdown
exit

interface FastEthernet0/1
 description LAN Switch12 (Semi)
 ip address 10.82.16.1 255.255.255.224
 no shutdown
exit

interface FastEthernet1/0
 description Link P2P to Shibuya
 ip address 10.82.16.89 255.255.255.252
 no shutdown
exit

ip dhcp pool POOL_SWITCH12
 network 10.82.16.0 255.255.255.224
 default-router 10.82.16.1
 dns-server 8.8.8.8
exit

ip route 0.0.0.0 0.0.0.0 10.82.16.85
ip route 10.82.15.0 255.255.255.192 10.82.16.90

end
write memory
