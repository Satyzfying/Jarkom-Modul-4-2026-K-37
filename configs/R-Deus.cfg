enable
configure terminal
hostname Deus
no ip domain-lookup

interface FastEthernet0/0
 description Link P2P to Tachibana
 ip address 10.82.16.74 255.255.255.252
 no shutdown
exit

interface FastEthernet0/1
 description LAN Switch10 (Lilith & Specter)
 ip address 10.82.14.1 255.255.255.128
 no shutdown
exit

interface FastEthernet1/0
 description Link P2P to Protocol7
 ip address 10.82.16.77 255.255.255.252
 no shutdown
exit

ip dhcp pool POOL_SWITCH10
 network 10.82.14.0 255.255.255.128
 default-router 10.82.14.1
 dns-server 8.8.8.8
exit

ip route 0.0.0.0 0.0.0.0 10.82.16.73

ip route 10.82.15.0 255.255.255.192 10.82.16.78
ip route 10.82.15.128 255.255.255.192 10.82.16.78
ip route 10.82.16.0 255.255.255.224 10.82.16.78
ip route 10.82.16.48 255.255.255.248 10.82.16.78
ip route 10.82.16.80 255.255.255.240 10.82.16.78

end
write memory
